<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JANスキャン">
<meta name="theme-color" content="#0f6e6a">
<title>JANスキャン相場メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef1f3; --surface:#ffffff; --ink:#1b2328; --muted:#5d6a72; --line:#d5dce0;
  --accent:#0f6e6a; --accent-ink:#ffffff; --accent-soft:#d9efed;
  --star:#c98a00; --star-soft:#fff3d6; --sold:#8a3b2e; --sold-soft:#f6e3df;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12171a; --surface:#1b2226; --ink:#e7ecee; --muted:#9aa7ae; --line:#2e383d;
  --accent:#4cbfb6; --accent-ink:#0b1513; --accent-soft:#183634;
  --star:#f2b630; --star-soft:#3a2f12; --sold:#e9998a; --sold-soft:#3b2220; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-inline:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700}
header small{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:700}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.big{width:100%;font-size:17px;min-height:60px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
input{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.status{font-size:13px;color:var(--muted);min-height:1.4em}
.status.err{color:var(--sold)}
.viewer{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;background:#000;border-radius:12px;overflow:hidden}
.viewer video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:8%;right:8%;top:35%;bottom:35%;border:2px solid rgba(255,255,255,.85);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.25);pointer-events:none}
.guide::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ff5b4a;opacity:.8}
.flash{position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none;transition:opacity .25s}
.flash.on{opacity:.35;transition:none}
.toast{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--font-num);font-size:16px;text-align:center;border-radius:8px;padding:6px}
.counter{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:12px;justify-content:space-between}
.digits{font-family:var(--font-num);font-size:24px;font-weight:600;letter-spacing:.06em;word-break:break-all}
.star{background:var(--surface);color:var(--muted);flex:0 0 auto;min-width:44px;font-size:20px;padding:6px 10px}
.star[aria-pressed="true"]{background:var(--star-soft);color:var(--star);border-color:var(--star)}
.sold{background:var(--sold-soft);color:var(--sold);border-color:transparent}
.onsale{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:none;min-height:40px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:start}
.item .name{font-weight:700;overflow-wrap:anywhere;min-width:0}
.item .meta{font-size:12px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.item .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.item .acts>*{min-height:36px;padding:6px 10px;font-size:13px}
.item .memo{grid-column:1/-1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
.hint{font-size:12px;color:var(--muted);margin:0}
textarea{width:100%;font-family:var(--font-num);font-size:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px;min-height:90px}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.danger{color:var(--sold)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px}
.switch input{width:auto;min-height:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>JANスキャン相場メモ</h1>
    <small>連続スキャン版</small>
  </header>

  <section class="card">
    <div class="label">読み取り</div>
    <div class="viewer" id="viewer" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="guide"></div>
      <div class="flash" id="flash"></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <button class="primary big" id="startBtn">スキャンを開始</button>
    <button class="big" id="stopBtn" hidden>スキャンを止める</button>
    <div class="row" style="align-items:center">
      <label class="switch"><input type="checkbox" id="soundOn" checked> 読み取り音</label>
      <span class="status counter" id="counter" style="text-align:right"></span>
    </div>
    <div class="status" id="status" role="status">バーコードを赤い線に合わせると、次々に読み取って履歴に追加します。</div>
    <form id="manualForm" class="row">
      <input id="manual" inputmode="numeric" pattern="[0-9]*" placeholder="JANを手入力（8桁・13桁）" aria-label="JANを手入力" style="font-family:var(--font-num)">
      <button type="submit" style="flex:0 0 auto">追加</button>
    </form>
  </section>

  <section class="card" id="current" hidden>
    <div class="label">最後に読み取った商品</div>
    <div class="bars">
      <div class="digits" id="curJan"></div>
      <button class="star" id="curStar" aria-pressed="false" aria-label="お気に入り">☆</button>
    </div>
    <input type="text" id="curName" placeholder="商品名（入れるとヒットしやすくなります）" aria-label="商品名">
    <div class="row">
      <input type="number" id="curCost" inputmode="numeric" placeholder="仕入値（円）" aria-label="仕入値">
      <input type="text" id="curMemo" placeholder="メモ（状態・相場など）" aria-label="メモ">
    </div>
    <div class="row">
      <a class="btn onsale" id="curOnSale" target="_blank" rel="noopener">販売中を見る</a>
      <a class="btn sold" id="curSold" target="_blank" rel="noopener">売り切れを見る</a>
    </div>
    <a class="btn" id="curLookup" target="_blank" rel="noopener">JANで商品名を調べる（Google）</a>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabHist" aria-selected="true">履歴 <span id="nHist"></span></button>
    <button role="tab" id="tabFav" aria-selected="false">お気に入り <span id="nFav"></span></button>
  </div>

  <ul class="list" id="list"></ul>

  <section class="card" id="exportBox" hidden>
    <div class="label">スプレッドシートへ転記</div>
    <div class="row">
      <button class="primary" id="copyBtn">表としてコピー</button>
      <button id="csvBtn">CSVで保存</button>
    </div>
    <div class="status" id="exportStatus" role="status"></div>
    <p class="hint">コピー後、GoogleスプレッドシートやExcelのA1セルを選んで貼り付けると、日付・JAN・商品名・仕入値・メモ・メルカリURLが列ごとに入ります。</p>
    <details>
      <summary>コピーできないときはこちら</summary>
      <p class="hint">下の文字を長押しで全選択してコピーしてください。</p>
      <textarea id="tsvBox" readonly aria-label="転記用テキスト"></textarea>
    </details>
    <button class="danger" id="clearFav">お気に入りをすべて外す</button>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
const KEY='janscan.v1';
const $=id=>document.getElementById(id);
let state={items:[],tab:'hist',cur:null};
let sessionCount=0;

function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.items))state.items=s.items.filter(i=>!i.sample)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({items:state.items}))}catch(e){}}

function kw(it){return (it.name&&it.name.trim())?it.name.trim():it.jan}
function mUrl(it,sold){
  let u='https://jp.mercari.com/search?keyword='+encodeURIComponent(kw(it));
  return u+(sold?'&status=sold_out%7Ctrading&sort=created_time&order=desc':'&status=on_sale');
}
function gUrl(it){return 'https://www.google.com/search?q='+encodeURIComponent(it.jan)}
function fmtDate(t){const d=new Date(t);const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function setStatus(msg,err){const s=$('status');s.textContent=msg;s.classList.toggle('err',!!err)}

// EAN/UPC のチェックディジット確認（誤読を減らす）
function validCheck(code){
  if(!/^\d+$/.test(code)) return false;
  if(![8,12,13].includes(code.length)) return true;
  const d=code.split('').map(Number);const last=d.pop();
  let sum=0;d.reverse().forEach((n,i)=>{sum+=n*(i%2===0?3:1)});
  return (10-sum%10)%10===last;
}

function addJan(jan,fromScan){
  jan=String(jan).replace(/\D/g,'');
  if(jan.length<8){setStatus('数字が短すぎます。8桁か13桁のJANを入れてください。',true);return false}
  if(!validCheck(jan)){if(!fromScan)setStatus('JANの数字が正しくないようです。もう一度確認してください。',true);return false}
  let it=state.items.find(i=>i.jan===jan);
  if(it){it.t=Date.now();state.items=[it,...state.items.filter(i=>i!==it)]}
  else{it={id:'i'+Date.now().toString(36),jan,name:'',cost:null,memo:'',fav:false,t:Date.now()};state.items.unshift(it)}
  if(state.items.length>500) state.items=state.items.filter((x,k)=>k<500||x.fav);
  save(); showCurrent(it,!fromScan); render();
  setStatus('読み取りました：'+jan);
  return true;
}

function showCurrent(it,scroll){
  state.cur=it;$('current').hidden=false;
  $('curJan').textContent=it.jan;
  $('curName').value=it.name||'';$('curCost').value=it.cost??'';$('curMemo').value=it.memo||'';
  syncCur();
  if(scroll)$('current').scrollIntoView({behavior:'smooth',block:'start'});
}
function syncCur(){
  const it=state.cur;if(!it)return;
  $('curStar').setAttribute('aria-pressed',it.fav?'true':'false');
  $('curStar').textContent=it.fav?'★':'☆';
  $('curOnSale').href=mUrl(it,false);$('curSold').href=mUrl(it,true);$('curLookup').href=gUrl(it);
}
['curName','curCost','curMemo'].forEach(id=>$(id).addEventListener('input',()=>{
  const it=state.cur;if(!it)return;
  it.name=$('curName').value;const c=$('curCost').value;it.cost=c===''?null:Number(c);it.memo=$('curMemo').value;
  save();syncCur();render();
}));
$('curStar').addEventListener('click',()=>{if(!state.cur)return;state.cur.fav=!state.cur.fav;save();syncCur();render()});

function render(){
  const favs=state.items.filter(i=>i.fav);
  $('nHist').textContent=state.items.length?'('+state.items.length+')':'';
  $('nFav').textContent=favs.length?'('+favs.length+')':'';
  $('tabHist').setAttribute('aria-selected',state.tab==='hist');
  $('tabFav').setAttribute('aria-selected',state.tab==='fav');
  const arr=state.tab==='fav'?favs:state.items;
  const ul=$('list');ul.textContent='';
  $('exportBox').hidden=!(state.tab==='fav'&&favs.length);
  if(!arr.length){
    const li=document.createElement('li');li.className='empty';
    li.textContent=state.tab==='fav'?'まだお気に入りはありません。履歴の ☆ を押すとここに集まります。':'まだ履歴はありません。「スキャンを開始」を押してバーコードを映してください。';
    ul.appendChild(li);return;
  }
  for(const it of arr){
    const li=document.createElement('li');li.className='item';
    const top=document.createElement('div');top.style.minWidth='0';
    const nm=document.createElement('div');nm.className='name';nm.textContent=it.name||'（商品名なし）';
    const meta=document.createElement('div');meta.className='meta';
    meta.textContent=it.jan+' ・ '+fmtDate(it.t)+(it.cost!=null&&it.cost!==''?' ・ 仕入 ¥'+Number(it.cost).toLocaleString('ja-JP'):'');
    top.append(nm,meta);
    const star=document.createElement('button');star.className='star';star.setAttribute('aria-pressed',it.fav?'true':'false');
    star.setAttribute('aria-label','お気に入り');star.textContent=it.fav?'★':'☆';
    star.onclick=()=>{it.fav=!it.fav;save();if(state.cur===it)syncCur();render()};
    li.append(top,star);
    if(it.memo){const m=document.createElement('div');m.className='memo';m.textContent=it.memo;li.appendChild(m)}
    const acts=document.createElement('div');acts.className='acts';
    const a1=document.createElement('a');a1.className='btn onsale';a1.textContent='販売中';a1.href=mUrl(it,false);a1.target='_blank';a1.rel='noopener';
    const a2=document.createElement('a');a2.className='btn sold';a2.textContent='売り切れ';a2.href=mUrl(it,true);a2.target='_blank';a2.rel='noopener';
    const ed=document.createElement('button');ed.textContent='編集';ed.onclick=()=>showCurrent(it,true);
    const del=document.createElement('button');del.textContent='削除';del.className='danger';
    del.onclick=()=>{if(del.dataset.armed){state.items=state.items.filter(x=>x!==it);if(state.cur===it){state.cur=null;$('current').hidden=true}save();render()}
      else{del.dataset.armed='1';del.textContent='もう一度押すと削除';setTimeout(()=>{if(del.isConnected){delete del.dataset.armed;del.textContent='削除'}},3000)}};
    acts.append(a1,a2,ed,del);li.appendChild(acts);
    ul.appendChild(li);
  }
  $('tsvBox').value=buildTable('\t');
}
$('tabHist').onclick=()=>{state.tab='hist';render()};
$('tabFav').onclick=()=>{state.tab='fav';render()};

/* ---- 転記 ---- */
function cell(v,sep){v=v==null?'':String(v);if(sep===',')return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;return v.replace(/[\t\n]/g,' ')}
function buildTable(sep){
  const head=['日付','JAN','商品名','仕入値','メモ','メルカリ販売中','メルカリ売り切れ'];
  const rows=state.items.filter(i=>i.fav).map(it=>[fmtDate(it.t),it.jan,it.name||'',it.cost??'',it.memo||'',mUrl(it,false),mUrl(it,true)]);
  return [head,...rows].map(r=>r.map(c=>cell(c,sep)).join(sep)).join('\n');
}
$('copyBtn').addEventListener('click',()=>{
  const txt=buildTable('\t');
  const fallback=()=>{const d=document.querySelector('#exportBox details');d.open=true;const t=$('tsvBox');t.value=txt;t.focus();t.select();$('exportStatus').textContent='自動コピーできませんでした。下の文字を選択してコピーしてください。'};
  try{navigator.clipboard.writeText(txt).then(()=>{$('exportStatus').textContent='コピーしました。スプレッドシートのA1セルに貼り付けてください。'}).catch(fallback)}catch(e){fallback()}
});
$('csvBtn').addEventListener('click',()=>{
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  const blob=new Blob(['﻿'+buildTable(',')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='mercari_favorites_'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  $('exportStatus').textContent='CSVを保存しました。';
});
$('clearFav').addEventListener('click',e=>{
  const b=e.currentTarget;
  if(b.dataset.armed){state.items.forEach(i=>i.fav=false);save();syncCur();render();delete b.dataset.armed;b.textContent='お気に入りをすべて外す'}
  else{b.dataset.armed='1';b.textContent='もう一度押すとすべて外します';setTimeout(()=>{delete b.dataset.armed;b.textContent='お気に入りをすべて外す'},3000)}
});
$('manualForm').addEventListener('submit',e=>{e.preventDefault();if(addJan($('manual').value,false))$('manual').value=''});

/* ---- 連続スキャン ---- */
let reader=null, audioCtx=null, lastCode='', lastTime=0, toastTimer=null;
function beep(){
  if(!$('soundOn').checked||!audioCtx)return;
  try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=1650;g.gain.value=0.12;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.09)}catch(e){}
}
function flashHit(code){
  const f=$('flash');f.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on')));
  const t=$('toast');t.textContent='✓ '+code;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,1500);
  if(navigator.vibrate)navigator.vibrate(60);
}
async function start(){
  if(!window.ZXing){setStatus('読み取り機能を読み込めませんでした。通信状況を確認してページを再読み込みしてください。',true);return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){setStatus('このブラウザではカメラが使えません。iPhoneはSafariで開いてください。',true);return}
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
  const Z=window.ZXing;
  const hints=new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128]);
  hints.set(Z.DecodeHintType.TRY_HARDER,true);
  reader=new Z.BrowserMultiFormatReader(hints,150);
  $('viewer').hidden=false;$('startBtn').hidden=true;$('stopBtn').hidden=false;
  setStatus('スキャン中… バーコードを赤い線に合わせてください。');
  try{
    await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('video'),(result)=>{
      if(!result)return;
      const code=result.getText();const now=Date.now();
      if(code===lastCode&&now-lastTime<3000){lastTime=now;return}  // 同じ商品の連続読み取りを無視
      lastCode=code;lastTime=now;
      if(addJan(code,true)){sessionCount++;$('counter').textContent='今回 '+sessionCount+' 件';beep();flashHit(code)}
    });
  }catch(err){
    stop();
    const n=err&&err.name;
    setStatus(n==='NotAllowedError'?'カメラの使用が許可されていません。Safariの「ぁあ」メニュー →「Webサイトの設定」→「カメラ」を「許可」にしてください。':'カメラを起動できませんでした。ページを再読み込みしてもう一度お試しください。',true);
  }
}
function stop(){
  try{reader&&reader.reset()}catch(e){}
  reader=null;$('viewer').hidden=true;$('startBtn').hidden=false;$('stopBtn').hidden=true;
  setStatus('スキャンを止めました。');
}
$('startBtn').addEventListener('click',start);
$('stopBtn').addEventListener('click',stop);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&reader)stop()});

load();render();
})();
</script>
</body>
</html>
